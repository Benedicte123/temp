<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input id="inputAnswer" type="text" />
    <button id= "checkAnswer"> Check answer</button>
    <h2 id="result"></h2> 


    <script>

        let input = document.getElementById ('inputAnswer');
        let button = document.getElementById ('checkAnswer');
        let result = document.getElementById ('result');

        button.addEventListener ('click', function(evt){
            let UserAnswer = input.value;
            let smallLetters = UserAnswer.toLowerCase();
            
            if (smallLetters == "cairo"){
                result.innerHTML = "The answer is correct!";
            } else {
                result.innerHTML = "Try again...";
            }
            
        });

    </script>


</body>
</html>
