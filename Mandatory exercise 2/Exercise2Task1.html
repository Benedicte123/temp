<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    
   <input id = "inpRadius" type="text" placeholder="Radius">
   <input id = "inpNumber" type="text" placeholder="Number of circles">
   <button id = "btnDraw">Draw circles</button>
   <br>
   <canvas id="cnv" width="500" height="500"></canvas>

        <script>

            const inpRadius = document.getElementById ('inpRadius');
            const inpNumber=document.getElementById ('inpNumber');
            const btnDraw = document.getElementById ('btnDraw');
            const cnv = document.getElementById ('cnv');

            const ctx = cnv.getContext("2d");

            

            btnDraw.addEventListener ('click', function(evt) {

                let radius = parseInt(inpRadius.value);
                let circleNum = parseInt(inpNumber.value);

                let dist = radius/ circleNum;

                ctx.clearRect(0, 0, 500, 500);

                for (let i = 0; i < circleNum; i++) {

                    let hue = (i/circleNum)*360; //deler på antall sirkler, ganger for å få en farge

                    ctx.beginPath ();
                    ctx.arc (250, 250, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = "hsl(" + hue + ", 100%, 50%)";
                    ctx.fill();
                    ctx.stroke();

                    radius = radius - dist;

                }

                

            });


        </script>


</body>
</html>
