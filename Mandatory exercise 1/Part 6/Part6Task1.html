    <script>

        let myNumbers = [4, 9, 3, 12];
        let startValue = 0;
        let sum = myNumbers.reduce(handleReduce, startValue);
        console.log(sum);
        let average = sum / myNumbers.length;
        console.log(average);

        function handleReduce(accumulatedValue, value){
            return accumulatedValue + value;


        }

        </script>
