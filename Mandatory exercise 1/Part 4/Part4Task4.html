<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <script>
        

        let i;
        let number= 0;

        for(i=0; i<10; i++) {
            let myH2 = document.createElement('h2');
            number++;
            let randomColor = Math.floor(Math.random()* 360) +1;

            myH2.innerHTML = number + " This is an h2-element!";

            myH2.style.color = "hsl(" + randomColor + ", 100%, 50%)";
            
            document.body.appendChild(myH2);

            


        }


        
    </script>


</body>
</html>
